  ruleId: ID! @ontologyProperty(uri: "ins:ruleId", label: "심사규칙 ID", range: "xsd:ID", sourceField: "rule_id")
  """심사규칙 코드 - 인수지침 표준 룰 코드"""
  ruleCode: String! @ontologyProperty(uri: "ins:ruleCode", label: "심사규칙 코드", range: "xsd:string", sourceField: "rule_cd")
  """심사규칙 명칭 - 언더라이팅 룰 제목"""
  ruleName: String! @ontologyProperty(uri: "ins:ruleName", label: "심사규칙 명칭", range: "xsd:string", sourceField: "rule_nm")
  """대상 위험분류 - 규칙이 검사하는 위험 카테고리"""
  targetRiskCategory: String! @ontologyProperty(uri: "ins:targetRiskCategory", label: "대상 위험분류", range: "xsd:string", sourceField: "tgt_risk_cat")
  """조건 표현식 - 룰 발동 조건식 (예: riskFactor == I10_HYPERTENSION && coverage == CARDIOVASCULAR)"""
  conditionExpression: String! @ontologyProperty(uri: "ins:conditionExpression", label: "조건 표현식", range: "xsd:string", sourceField: "cond_expr")
  """판정 액션 유형 - 룰 적중 시 수행할 판정 액션 (ACCEPT, PREMIUM_LOADING, COVERAGE_EXCLUSION, BENEFIT_LIMIT, DECLINE)"""
  actionType: String! @ontologyProperty(uri: "ins:actionType", label: "판정 액션 유형", range: "xsd:string", sourceField: "act_type")
  """심사지침 해설 - 인수심사 매뉴얼 상의 상세 근거 설명"""
  ruleDescription: String! @ontologyProperty(uri: "ins:ruleDescription", label: "심사지침 해설", range: "xsd:string", sourceField: "rule_desc")
}

"""
[Underwriting Domain] 언더라이팅 심사결정 (Underwriting Decision)
인수심사 룰 엔진과 심사역 평가를 거쳐 도출된 최종 인수 판정(승낙/할증/부담보/거절) 및 보험료 산출 내역
Ontology RDFS Class: ins:UnderwritingDecision
Source Service: underwriting-engine-service (GET /mock/uw-service/cases/{caseId}/decision)
"""
type UnderwritingDecision @ontologyClass(
  uri: "ins:UnderwritingDecision"
  label: "언더라이팅 심사결정 (Underwriting Decision)"
  domain: "Underwriting"
  sourceService: "underwriting-engine-service"
  sourceEndpoint: "GET /mock/uw-service/cases/{caseId}/decision"
) {
  """결정 ID - 심사 결정 고유 식별자"""
  decisionId: ID! @ontologyProperty(uri: "ins:decisionId", label: "결정 ID", range: "xsd:ID", sourceField: "dec_id")
  """최종 인수판정 결과 - 승낙(STANDARD_ACCEPT), 할증승낙(SUBSTANDARD_LOADING), 부담보승낙(CONDITIONAL_EXCLUSION), 거절(DECLINED)"""
  decisionOutcome: String! @ontologyProperty(uri: "ins:decisionOutcome", label: "최종 인수판정 결과", range: "xsd:string", sourceField: "dec_outcome")
  """최종 산출 월보험료(원) - 할증률 및 담보 조정이 반영된 최종 월 납입보험료"""
  finalMonthlyPremium: Int! @ontologyProperty(uri: "ins:finalMonthlyPremium", label: "최종 산출 월보험료(원)", range: "xsd:int", sourceField: "fnl_mm_prem")
  """위험 할증 보험료(원) - 기본 보험료 대비 위험도 할증으로 추가된 금액"""
  surchargeAmount: Int! @ontologyProperty(uri: "ins:surchargeAmount", label: "위험 할증 보험료(원)", range: "xsd:int", sourceField: "surchg_amt")
  """할증률(%) - 적용된 보험료 할증 비율(%)"""
  loadingPercentage: Float! @ontologyProperty(uri: "ins:loadingPercentage", label: "할증률(%)", range: "xsd:float", sourceField: "load_pct")
  """특정부위/질병 부담보 조건 - 인수 조건으로 부과된 전기간 또는 특정기간 부담보(보장제외) 부위/질병 목록"""
  exclusionClauses: [String!]! @ontologyProperty(uri: "ins:exclusionClauses", label: "특정부위/질병 부담보 조건", range: "xsd:string", sourceField: "excl_clauses")
  """심사역/AI 종합 소견 - 언더라이팅 판정에 대한 종합 근거 요약"""
  underwriterComment: String! @ontologyProperty(uri: "ins:underwriterComment", label: "심사역/AI 종합 소견", range: "xsd:string", sourceField: "uw_comment")
  """자동심사(STP) 처리 여부 - 인적 심사 없이 AI/룰 엔진에 의해 무인 자동심사(Straight-Through Processing)로 완결되었는지 여부"""
  automatedDecision: Boolean! @ontologyProperty(uri: "ins:automatedDecision", label: "자동심사(STP) 처리 여부", range: "xsd:boolean", sourceField: "stp_auto_yn")
}

"데이터 계보(Data Lineage) 추적 엔트리: GraphQL 필드가 어떤 온톨로지 개념 및 백엔드 서비스 호출로부터 도출되었는지 기록"
type LineageStep {
  stepOrder: Int!
  graphqlFieldPath: String!
  ontologyClassUri: String!
  ontologyPropertyUri: String!
  domainName: String!
  sourceService: String!
  httpMethod: String!
  endpointUri: String!
  rawSourceFields: [String!]!
  latencyMs: Int!
  status: String!
}

"언더라이팅 시뮬레이션 요청 입력"
input UnderwritingSimulationInput {
  productId: ID!
  applicantName: String!
  age: Int!
  gender: String!
  occupationName: String!
  occupationGrade: Int!
  isSmoker: Boolean!
  bmi: Float!
  riskFactorCodes: [String!]!
}

type Query {
  "모든 언더라이팅 심사건 목록 조회 (Product + Risk + Underwriting 3개 도메인 통합 그래프)"
  underwritingCases: [UnderwritingCase!]!

  "특정 언더라이팅 심사건 단건 조회 (3개 도메인 마이크로서비스 조립)"
  underwritingCase(caseId: ID!): UnderwritingCase

  "판매 중인 보험상품 카탈로그 및 담보/급부 조회 (Product Domain)"
  insuranceProducts(category: String): [InsuranceProduct!]!

  "특정 보험상품 단건 조회 (Product Domain)"
  insuranceProduct(productId: ID!): InsuranceProduct

  "피보험자/청약자 위험 프로필 목록 조회 (Risk Domain)"
  applicantProfiles: [ApplicantProfile!]!

  "특정 피보험자 위험 프로필 단건 조회 (Risk Domain)"
  applicantProfile(applicantId: ID!): ApplicantProfile

  "인수심사 규칙(Underwriting Rule) 마스터 목록 조회 (Underwriting Domain)"
  underwritingRules(riskCategory: String): [UnderwritingRule!]!

  "최근 실행된 GraphQL 쿼리의 데이터 계보(Lineage) 트레이스 조회"
  latestLineageTraces: [LineageStep!]!
}

type Mutation {
  "실시간 언더라이팅 & 리스크 인수심사 시뮬레이션 실행"
  simulateUnderwriting(input: UnderwritingSimulationInput!): UnderwritingCase!
}
